<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Email Assistant – Progress</title>
  <link rel="stylesheet" href="progress.css">
</head>
<body>
  <div id="progress-root">
    <div id="header">
      <span id="header-icon">✉</span>
      <span id="header-title">Email AI Assistant</span>
      <span id="header-pct">0%</span>
    </div>
    <div id="bar-track">
      <div id="bar-fill"></div>
    </div>
    <div id="footer">
      <span id="status-text">Starting…</span>
      <div id="controls">
        <button id="cancel-btn">Cancel</button>
        <button id="close-btn" disabled>Close</button>
      </div>
    </div>
  </div>
  <script src="progress.js"></script>
</body>
</html>
